# E2E: nested k8s (k3d-in-docker) → helm install → helm test
# Mirrors opensearch-migrations Jenkins minikube flow
on:
  push:
    branches: [main]

steps:
  - name: nested-k8s-helm-test
    image: docker:27
    docker: true
    privileged: true
    timeout: 15m
    command: |
      set -ex
      echo "=== Step 1: Install tools ==="
      apk add --no-cache curl bash

      # Install kubectl
      curl -fsSL -o /usr/local/bin/kubectl \
        "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')/kubectl"
      chmod +x /usr/local/bin/kubectl

      # Install helm
      curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # Install k3d (works in DinD without systemd, unlike kind)
      curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      echo "=== Step 2: Wait for Docker daemon ==="
      for i in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        echo "Waiting for Docker... ($i)"
        sleep 2
      done
      docker info

      echo "=== Step 3: Create k3d cluster ==="
      k3d cluster create ci-test --wait --timeout 120s

      # Use k3d kubeconfig explicitly (avoid inheriting pod's SA kubeconfig)
      export KUBECONFIG=$(k3d kubeconfig write ci-test)
      kubectl cluster-info
      kubectl get nodes

      echo "=== Step 4: Helm install ==="
      helm install test-app ./chart --wait --timeout 120s
      kubectl get pods
      kubectl get svc

      echo "=== Step 5: Helm test ==="
      helm test test-app --timeout 120s

      echo "=== Step 6: Verify ==="
      kubectl get pods
      echo "✅ Nested K8s + Helm test passed!"

      echo "=== Step 7: Cleanup ==="
      helm uninstall test-app
      k3d cluster delete ci-test
