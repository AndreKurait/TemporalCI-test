# E2E: nested k8s (k3s direct) → helm install → helm test
# Mirrors opensearch-migrations Jenkins minikube flow
on:
  push:
    branches: [main]

steps:
  - name: nested-k8s-helm-test
    image: rancher/k3s:v1.31.5-k3s1
    privileged: true
    timeout: 15m
    command: |
      set -ex
      echo "=== Step 1: Start k3s server ==="
      # Start k3s in background
      k3s server --disable=traefik --disable=metrics-server &
      K3S_PID=$!

      # Wait for k3s to be ready
      echo "Waiting for k3s to start..."
      for i in $(seq 1 60); do
        if k3s kubectl get nodes 2>/dev/null | grep -q " Ready"; then
          echo "✅ k3s is ready!"
          break
        fi
        echo "  Attempt $i: waiting..."
        sleep 3
      done
      k3s kubectl get nodes

      echo "=== Step 2: Install helm ==="
      # k3s image is based on Alpine
      apk add --no-cache curl bash openssl 2>/dev/null || true
      curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | KUBECONFIG=/etc/rancher/k3s/k3s.yaml bash

      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

      echo "=== Step 3: Helm install ==="
      helm install test-app ./chart --wait --timeout 120s
      k3s kubectl get pods
      k3s kubectl get svc

      echo "=== Step 4: Helm test ==="
      helm test test-app --timeout 120s

      echo "=== Step 5: Verify ==="
      k3s kubectl get pods
      echo "✅ Nested K8s + Helm test passed!"

      echo "=== Step 6: Cleanup ==="
      helm uninstall test-app
      kill $K3S_PID 2>/dev/null || true
