# E2E: helm install → helm test on the host k8s cluster
# Mirrors opensearch-migrations Jenkins minikube flow:
# Jenkins runs on minikube and deploys to the same minikube cluster
on:
  push:
    branches: [main]

steps:
  - name: helm-deploy-test
    image: alpine/helm:latest
    timeout: 10m
    command: |
      set -ex
      echo "=== Step 1: Verify cluster access ==="
      # The CI pod runs inside minikube with a service account
      # that has cluster-admin (from worker-rbac.yaml)
      kubectl get nodes
      kubectl get ns

      echo "=== Step 2: Create test namespace ==="
      kubectl create namespace helm-e2e-test --dry-run=client -o yaml | kubectl apply -f -

      echo "=== Step 3: Helm install ==="
      helm install test-app ./chart -n helm-e2e-test --wait --timeout 120s
      kubectl get pods -n helm-e2e-test
      kubectl get svc -n helm-e2e-test

      echo "=== Step 4: Helm test ==="
      helm test test-app -n helm-e2e-test --timeout 120s

      echo "=== Step 5: Verify ==="
      kubectl get pods -n helm-e2e-test
      echo "✅ Helm deploy + test passed!"

      echo "=== Step 6: Cleanup ==="
      helm uninstall test-app -n helm-e2e-test
      kubectl delete namespace helm-e2e-test
